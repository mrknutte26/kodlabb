name: Accept Hall of Fame

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '!halloffame')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install node-fetch@2

      - name: Check and accept Hall of Fame
        run: node scripts/accept-halloffame.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit Hall of Fame update
        run: |
          git config user.name "kodlabb-bot"
          git config user.email "bot@kodlabb.dev"
          git add src/hall-of-fame.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Add contributor to Hall of Fame"
          git push
